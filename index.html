<!doctype html><html lang="zh-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><title>课堂小助手 • 中文版</title><style>:root{--teal:#0f766e;--teal2:#dff6f1;--navy:#17324d;--muted:#667085;--line:#d8e1e8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#eff8f6,#f7f9fc 55%,#edf3f8);font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",Inter,system-ui,sans-serif;color:#17202a;padding:24px}.card{width:min(760px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:0 24px 60px rgba(18,32,46,.12)}.logo{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--teal2);color:var(--teal);font-size:29px;font-weight:950;margin-bottom:16px}h1{margin:0 0 8px;font-size:34px;color:var(--navy)}p{color:var(--muted);line-height:1.65}.steps{display:grid;gap:12px;margin:22px 0}.step{display:grid;grid-template-columns:34px 1fr;gap:10px}.num{width:30px;height:30px;border-radius:10px;background:var(--teal2);color:var(--teal);font-weight:1000;display:grid;place-items:center}.bookmark{display:flex;align-items:center;justify-content:center;min-height:60px;border:2px solid var(--teal);border-radius:16px;background:linear-gradient(145deg,#0f766e,#0b5f59);color:#fff;text-decoration:none;font-weight:1000;font-size:19px;cursor:grab}.hint{text-align:center;font-size:12px;color:var(--muted);font-weight:800;margin:9px 0 18px}.test{width:100%;min-height:50px;border:1px solid #9dd9d0;border-radius:14px;background:var(--teal2);color:#0a5d57;font-weight:950;cursor:pointer}.warn{margin-top:18px;padding:13px 15px;border-radius:14px;background:#fff7ed;color:#9a3412;font-size:13px;font-weight:800;line-height:1.55}.credit{margin-top:16px;padding-top:14px;border-top:1px solid #edf1f4;text-align:center;color:#667085;font-size:12px;font-weight:800}</style></head><body><main class="card"><div class="logo">✦</div><h1>课堂小助手</h1><p>把下面的按钮拖到 Chrome 书签栏。上课时点击书签，会在左侧打开一个全新的教师工具面板。</p><div class="steps"><div class="step"><div class="num">1</div><div><b>显示书签栏：</b> Ctrl + Shift + B</div></div><div class="step"><div class="num">2</div><div><b>把下面按钮拖到书签栏。</b></div></div><div class="step"><div class="num">3</div><div><b>上课时点击“课堂小助手”。</b></div></div></div><a id="bookmark" class="bookmark" href="#">✦ 课堂小助手</a><div class="hint">请用这个新版书签替换旧书签</div><button class="test" id="test">立即测试工具栏</button><div class="warn"><b>注意：</b>Chrome 不会在“新标签页”、设置页或 Chrome 网上应用店等内部页面运行 JavaScript 书签。请在普通网页上使用。</div><div class="credit">Created by <strong>Lim Kim Sze</strong> • 中文版</div></main><script>const toolbarUrl=new URL('widget-launch.html',location.href).href;function features(){const sh=screen.availHeight||800,w=350,h=Math.min(740,Math.max(620,sh-40)),l=(screen.availLeft||0)+8,t=(screen.availTop||0)+8;return `popup=yes,width=${w},height=${h},left=${l},top=${t},resizable=yes,scrollbars=no,toolbar=no,location=no,menubar=no,status=no`}function openFresh(){let x=null;try{x=window.open('about:blank','_blank',features())}catch(e){}if(!x)return null;try{x.location.replace(toolbarUrl+'?v='+Date.now())}catch(e){try{x.location.href=toolbarUrl+'?v='+Date.now()}catch(_){}}try{x.focus()}catch(e){}return x}function popupCode(){return `(function(){var sh=screen.availHeight||800,w=350,h=Math.min(740,Math.max(620,sh-40)),l=(screen.availLeft||0)+8,t=(screen.availTop||0)+8,f='popup=yes,width='+w+',height='+h+',left='+l+',top='+t+',resizable=yes,scrollbars=no,toolbar=no,location=no,menubar=no,status=no',x=null;try{x=window.open('about:blank','_blank',f)}catch(e){}if(!x){alert('请允许弹出式窗口，然后再试一次。');return}try{x.location.replace('${toolbarUrl}?v='+Date.now())}catch(e){try{x.location.href='${toolbarUrl}?v='+Date.now()}catch(_){}}try{x.focus()}catch(e){}})();`}document.getElementById('bookmark').href='javascript:'+popupCode();document.getElementById('test').onclick=()=>{if(!openFresh())alert('请允许弹出式窗口，然后再试一次。')};</script></body></html>
