<!doctype html>
<html lang="zh-SG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>课堂小助手 • 中文版工具栏</title>
<style>
:root{--teal:#0f766e;--teal2:#e7f7f4;--navy:#17324d;--line:#d7e4e2;--muted:#64748b;--gold:#f59e0b;--blue:#6478b5}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",Inter,system-ui,sans-serif;color:var(--navy)}body{padding:0}.palette{position:fixed;inset:0;background:rgba(255,255,255,.985);border:1px solid #cfe0de;border-radius:20px;box-shadow:0 18px 44px rgba(18,32,46,.22);display:flex;flex-direction:column;overflow:hidden}.head{padding:14px 14px 11px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #edf2f2}.brand{width:42px;height:42px;border-radius:13px;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:1000;flex:none}.meta{min-width:0;flex:1}.title{font-size:17px;font-weight:1000;letter-spacing:-.02em}.sub{font-size:10px;color:var(--muted);font-weight:800;margin-top:2px}.status{font-size:10px;font-weight:900;padding:5px 8px;border-radius:999px;background:#f1f5f4;color:#42615d;white-space:nowrap}.grid{padding:11px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;overflow:auto;flex:1}.tool{min-height:58px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#fff,#f7fbfa);display:grid;grid-template-columns:36px 1fr 8px;gap:8px;align-items:center;padding:8px 9px;text-align:left;cursor:pointer;box-shadow:0 4px 11px rgba(18,32,46,.04);transition:.12s ease}.tool:hover,.tool:focus-visible{transform:translateY(-1px);border-color:#79c8bc;box-shadow:0 8px 18px rgba(15,118,110,.10);outline:none}.tool.active{background:#eaf8f5;border-color:#0f766e}.tool.expanded{outline:2px solid #f59e0b;outline-offset:1px}.icon{font-size:25px;line-height:1}.name{font-size:12px;font-weight:1000;line-height:1.15;color:var(--navy)}.modeDot{width:7px;height:7px;border-radius:99px}.mini .modeDot{background:var(--teal)}.half .modeDot{background:var(--blue)}.full .modeDot{background:var(--gold)}.foot{border-top:1px solid #edf2f2;padding:8px 11px;display:flex;align-items:center;gap:8px}.legend{font-size:9px;color:#71807e;font-weight:850;line-height:1.35;flex:1}.close{border:0;border-radius:10px;background:#f2f5f5;color:#49605e;font-weight:1000;padding:7px 10px;cursor:pointer}.toast{position:absolute;left:10px;right:10px;bottom:52px;background:#17324d;color:#fff;border-radius:12px;padding:8px 10px;font-size:11px;font-weight:850;text-align:center;opacity:0;transform:translateY(5px);pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:none}@media(max-width:500px){.palette{border-radius:0}.grid{grid-template-columns:repeat(2,minmax(0,1fr));padding:8px;gap:6px}.tool{min-height:54px;padding:7px}.name{font-size:11px}.head{padding:10px}.status{display:none}}
</style>
<script src="https://cdn.counter.dev/script.js" data-id="825e93b6-ce99-40ef-8bcc-125f13297433" data-utcoffset="8"></script>
</head>
<body>
<div class="palette">
  <header class="head"><div class="brand">✦</div><div class="meta"><div class="title">课堂小助手</div><div class="sub">教师工具 • Created by Lim Kim Sze</div></div><div class="status" id="status">检测中…</div></header>
  <main class="grid" id="grid"></main>
  <div class="toast" id="toast"></div>
  <footer class="foot"><div class="legend">青绿：迷你工具　蓝色：半屏工具　金色：全屏工具<br>支持的 Chrome 会把迷你工具显示为置顶小窗。</div><button class="close" id="closeBtn">关闭</button></footer>
</div>
<script>
'use strict';
const TOOLS=[
 {slug:'timer-calm-music',icon:'⏱️',title:'计时器＋轻音乐',mode:'mini'},
 {slug:'transition-countdown',icon:'⏳',title:'过渡倒计时',mode:'mini'},
 {slug:'attention-signal',icon:'👀',title:'注意信号',mode:'mini'},
 {slug:'noise-level',icon:'🔊',title:'音量等级',mode:'mini'},
 {slug:'question-spinner',icon:'💬',title:'句子开头',mode:'half'},
 {slug:'confidence-check',icon:'📈',title:'学习信心',mode:'half'},
 {slug:'pick-a-pupil',icon:'🎯',title:'随机点名',mode:'mini'},
 {slug:'make-groups',icon:'👥',title:'随机分组',mode:'half'},
 {slug:'brain-break',icon:'🧠',title:'伸展休息',mode:'full'},
 {slug:'reflect',icon:'💭',title:'学习反思',mode:'half'},
 {slug:'quote-of-the-day',icon:'✨',title:'每日一句',mode:'full'},
 {slug:'class-organisation',icon:'🗂️',title:'班级管理',mode:'full'},
 {slug:'daily-duty-roster',icon:'🧹',title:'每日值日表',mode:'full'},
 {slug:'pupil-reward-points',icon:'⭐',title:'学生奖励积分',mode:'half'},
 {slug:'group-reward-points',icon:'🏆',title:'小组奖励积分',mode:'half'},
 {slug:'daily-visual-timetable',icon:'🗓️',title:'每日视觉课表',mode:'full'}
];
const DIRECT={
 'class-organisation':'page.html?src='+encodeURIComponent('class-organisation.html'),
 'daily-duty-roster':'page.html?src='+encodeURIComponent('daily-duty-roster.html'),
 'pupil-reward-points':'page.html?src='+encodeURIComponent('reward-points.html?mode=pupil'),
 'group-reward-points':'page.html?src='+encodeURIComponent('reward-points.html?mode=group')
};
const grid=document.getElementById('grid'),toast=document.getElementById('toast'),status=document.getElementById('status');
const buttons=new Map(),windows=new Map();let pip=null,pipSlug='';
const hasPiP=!!(window.documentPictureInPicture&&typeof window.documentPictureInPicture.requestWindow==='function');
status.textContent=hasPiP?'✓ 支持置顶小窗':'普通弹窗模式';status.style.background=hasPiP?'#e7f7f4':'#fff4df';status.style.color=hasPiP?'#0f766e':'#8a5b00';
function say(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('show'),1800)}
function toolUrl(t){const base=DIRECT[t.slug];return base?base+'&v='+Date.now():'support-tool.html?tool='+encodeURIComponent(t.slug)+'&v='+Date.now()}
function screenBox(){return{left:Number.isFinite(screen.availLeft)?screen.availLeft:0,top:Number.isFinite(screen.availTop)?screen.availTop:0,w:screen.availWidth||1280,h:screen.availHeight||800}}
function spec(mode){const s=screenBox();if(mode==='full')return{x:s.left+6,y:s.top+6,w:Math.max(900,s.w-12),h:Math.max(650,s.h-12)};if(mode==='half'){const w=Math.max(620,Math.round(s.w*.52));return{x:s.left+s.w-w-8,y:s.top+8,w,h:Math.max(600,s.h-16)}}const w=Math.min(500,Math.max(410,Math.round(s.w*.3))),h=Math.min(390,Math.max(300,Math.round(s.h*.34)));return{x:s.left+s.w-w-10,y:s.top+10,w,h}}
function mark(slug,on){buttons.get(slug)?.classList.toggle('active',!!on)}
async function openPiP(t){if(!hasPiP)return false;try{if(pip&&!pip.closed&&pipSlug===t.slug){try{pip.focus()}catch(e){};return true}if(pip&&!pip.closed){try{pip.close()}catch(e){}}pip=await window.documentPictureInPicture.requestWindow({width:460,height:350});pipSlug=t.slug;mark(t.slug,true);const d=pip.document;d.title=t.title;d.documentElement.style.cssText='margin:0;width:100%;height:100%;overflow:hidden;background:#fff';d.body.style.cssText='margin:0;width:100%;height:100%;overflow:hidden;background:#fff';const f=d.createElement('iframe');f.src=toolUrl(t);f.title=t.title;f.allow='autoplay';f.style.cssText='display:block;width:100%;height:100%;border:0;background:#fff';d.body.replaceChildren(f);pip.addEventListener('pagehide',()=>{mark(t.slug,false);pip=null;pipSlug=''},{once:true});return true}catch(e){pip=null;pipSlug='';mark(t.slug,false);return false}}
function openPopup(t){const old=windows.get(t.slug);if(old){try{if(!old.closed){old.focus();return}}catch(e){}}const s=spec(t.mode),name='ClassroomCompanionCN_'+t.slug.replace(/[^a-z0-9]/gi,'_');const w=window.open(toolUrl(t),name,`popup=yes,width=${s.w},height=${s.h},left=${s.x},top=${s.y},resizable=yes,scrollbars=yes,toolbar=no,location=no,menubar=no,status=no`);if(!w){say('请允许弹出式窗口');return}windows.set(t.slug,w);mark(t.slug,true);try{w.focus()}catch(e){}setTimeout(()=>{try{w.resizeTo(s.w,s.h);w.moveTo(s.x,s.y)}catch(e){}},120)}
async function openTool(t){if(t.mode==='mini'&&hasPiP){const ok=await openPiP(t);if(ok){say(t.title+'已打开为置顶小窗');return}}openPopup(t)}
for(const t of TOOLS){const b=document.createElement('button');b.type='button';b.className='tool '+t.mode;b.innerHTML=`<span class="icon">${t.icon}</span><span class="name">${t.title}</span><span class="modeDot"></span>`;b.setAttribute('aria-label',t.title);b.onclick=()=>openTool(t);grid.appendChild(b);buttons.set(t.slug,b)}
setInterval(()=>{for(const [slug,w] of [...windows]){let closed=true;try{closed=!w||w.closed}catch(e){}if(closed){windows.delete(slug);mark(slug,false)}}},900);
document.getElementById('closeBtn').onclick=()=>window.close();
</script>
<script src="extra-tools.js?v=20261007extra2"></script>
<script src="/Classroom-Companion/language-window-parity.js?v=20261006langfull1"></script>
</body>
</html>
